title: Julien Becheny
description: >-
  Ingénieur QA Automation. Notes sur l'automatisation des tests, le mobile natif,
  la performance et l'outillage qui rend les tests fiables.
url: https://julien-becheny.github.io
lang: fr
author: Julien Becheny

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Une URL par article, lisible et stable : elle ne changera plus jamais.
permalink: /blog/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

feed:
  path: feed.xml

# Mesure d'audience. Renseigner le sous-domaine GoatCounter pour l'activer,
# par exemple "julienbecheny" pour julienbecheny.goatcounter.com.
# Vide : aucun script n'est chargé, aucune donnée n'est collectée.
# Sans cookie ni identifiant persistant, donc sans bannière de consentement.
goatcounter: "julienbecheny"

exclude:
  - README.md
  - .github/
